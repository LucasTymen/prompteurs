<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquidSpeakerine — Doublage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ZONE TEXTE (en haut de l'écran) */
        .text-container {
            position: relative;
            width: 100vw;
            height: 60px;
            overflow: hidden;
            white-space: nowrap;
            background: #111;
            border-bottom: 1px solid #333;
        }

        /* TEXTE */
        .text {
            position: absolute;
            top: 0;
            left: 100vw;
            white-space: nowrap;
            font-size: 2em;
            will-change: transform;
        }

        /* LIGNE ROUGE FIXE (centrale) */
        .marker {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: red;
            z-index: 10;
        }

        /* CONTAINER POUR LES CONTRÔLES */
        .controls-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            overflow-y: auto;
        }

        /* ZONE DE SAISIE */
        .input-container {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 20px;
        }
        #textInput {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            background: #222;
            color: white;
            border: 1px solid #333;
            border-radius: 4px;
            resize: none;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 8px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }

        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <!-- Zone d'affichage du prompteur (en haut) -->
    <div class="text-container">
        <div class="marker"></div>
        <div class="text" id="text"></div>
    </div>

    <!-- Zone de contrôle (en dessous) -->
    <div class="controls-container">
        <div class="input-container">
            <textarea id="textInput" placeholder="Saisissez votre texte ici...">Bonjour à tous, aujourd’hui je vais vous présenter mon projet Scooter Research...</textarea>
            <button id="updateTextBtn">Mettre à jour le texte</button>
        </div>

        <div class="controls">
            <button id="play">Play</button>
            <button id="reset">Reset</button>
            <span>Vitesse</span>
            <input type="range" id="speed" min="-20" max="20" step="0.5" value="0">
            <span id="speedValue">0</span>
            <span>Taille</span>
            <input type="range" id="size" min="1" max="4" step="0.1" value="2">
            <span id="sizeValue">2em</span>
        </div>
    </div>

    <script>
        const textElement = document.getElementById("text");
        const textInput = document.getElementById("textInput");
        const updateTextBtn = document.getElementById("updateTextBtn");
        const playBtn = document.getElementById("play");
        const resetBtn = document.getElementById("reset");
        const speedControl = document.getElementById("speed");
        const speedValue = document.getElementById("speedValue");
        const sizeControl = document.getElementById("size");
        const sizeValue = document.getElementById("sizeValue");

        let isPlaying = false;
        let position = 0;
        let velocity = 0;

        /* METTRE À JOUR LE TEXTE */
        function updateText() {
            textElement.textContent = textInput.value;
            resetPosition();
        }

        /* INIT POSITION (texte à droite) */
        function resetPosition() {
            position = window.innerWidth;
            textElement.style.left = `${position}px`;
        }

        /* LOOP */
        function loop() {
            if (!isPlaying) return;
            position -= velocity;
            textElement.style.left = `${position}px`;

            // Si le texte est complètement sorti de l'écran à gauche, on le replace à droite
            if (position < -textElement.scrollWidth) {
                position = window.innerWidth;
            }
            requestAnimationFrame(loop);
        }

        /* PLAY */
        playBtn.onclick = () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? "Pause" : "Play";
            if (isPlaying) loop();
        };

        /* RESET */
        resetBtn.onclick = () => {
            isPlaying = false;
            resetPosition();
            playBtn.textContent = "Play";
        };

        /* VITESSE (plage étendue) */
        speedControl.oninput = () => {
            velocity = parseFloat(speedControl.value);
            speedValue.textContent = velocity;
        };

        /* TAILLE EN EM */
        sizeControl.oninput = () => {
            const newSize = sizeControl.value;
            textElement.style.fontSize = `${newSize}em`;
            sizeValue.textContent = `${newSize}em`;
        };

        /* METTRE À JOUR LE TEXTE AU CLIC */
        updateTextBtn.onclick = updateText;

        /* INIT */
        updateText();

        /* RACCOURCI ESPACE */
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                playBtn.click();
            }
        });

        /* Gestion du redimensionnement de la fenêtre */
        window.addEventListener("resize", resetPosition);
    </script>
</body>
</html>
